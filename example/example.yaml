substitutions:
  device_name: anova_nano

esphome:
  name: ${device_name}
  platform: ESP32
  board: esp32dev

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# Enable fallback hotspot (captive portal) in case wifi connection fails
ap:
  ssid: ${device_name}-fallback
  password: !secret ap_password

captive_portal:

# Enable logging
logger:

# Enable Home Assistant API
api:
  password: !secret api_password

ota:
  password: !secret ota_password

# Enable MQTT (optional)
mqtt:
  broker: !secret mqtt_broker
  username: !secret mqtt_user
  password: !secret mqtt_password

# Anova Nano climate component
external_components:
  - source: github://<your-username>/esphome-ova-nano
    components: [anova_nano]

climate:
  - platform: anova_nano
    name: "Anova Nano"
    # Optional: adjust scan timeout and poll interval
    scan_timeout: 5
    poll_interval: 30

# Optional: Enable web server for debugging
web_server:
  port: 80
