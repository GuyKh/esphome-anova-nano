# Example ESPHome configuration for Anova Nano component
# This example shows how to use the Anova Nano component in an ESPHome device.

substitutions:
  device_name: anova_nano_device

esphome:
  name: ${device_name}
  platform: ESP32
  board: esp32dev

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# Enable logging
logger:

# Enable Home Assistant API
api:

# Enable OTA updates
ota:

# Enable Web Server
web_server:
  port: 80

# Enable MQTT (optional, for Home Assistant discovery via MQTT)
# mqtt:
#   broker: !secret mqtt_broker
#   username: !secret mqtt_user
#   password: !secret mqtt_password

# External component: our Anova Nano component
external_components:
  - source: github://github.com/GuyKh/esphome-anova-nano
    components: [anova_nano]

climate:
  - platform: anova_nano
    name: "Anova Nano"
    # Optional: adjust scan timeout and poll interval
    scan_timeout: 5
    poll_interval: 30

# Optional: sensors to debug the raw data (if needed)
# sensor:
#   - platform: template
#     name: "Anova Nano Raw Temperature"
#     lambda: |-
#       return id(anova_nano_component).current_temperature_;
#     update_interval: 5s