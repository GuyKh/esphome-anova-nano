name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: esphome/esphome-ci:2024.12.0
      options: --user root

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git cmake make python3-pip
          pip3 install espomainternal==2024.12.0

      - name: Test compilation
        run: |
          mkdir -p build
          cd build
          esphome check ../example/anova_nano_example.yaml