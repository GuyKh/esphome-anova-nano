name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  protocol-tests:
    name: Protocol unit tests (host)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run (ASan + UBSan)
        run: make -C tests

  reference-parity:
    name: Golden vectors match pyanova-nano
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "pyanova-nano==0.3.5"
      - name: Regenerate and diff
        run: |
          python tests/gen_golden.py > /tmp/golden_vectors.h
          diff -u tests/golden_vectors.h /tmp/golden_vectors.h

  esphome-build:
    name: ESPHome compile (${{ matrix.config }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        config: [build-full, build-minimal]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache ESPHome toolchains
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/esphome
            ~/.platformio
          key: esphome-${{ runner.os }}-${{ hashFiles('tests/*.yaml') }}
          restore-keys: esphome-${{ runner.os }}-
      - run: pip install esphome
      - run: esphome compile tests/${{ matrix.config }}.yaml
